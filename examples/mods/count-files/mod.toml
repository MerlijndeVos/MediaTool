id = "count-files"
name = "Count Files"
description = "Count the files in a folder, grouped by extension."
version = "1.0.0"
author = "Toolbox"
api_version = 1            # the simplest mods need only API 1 and still work
# group = the menu section the tool appears in. Use one of these, spelled like this:
#   Files         rename, move or organize files and folders
#   Media         convert, cut, join or download video and audio
#   Subtitles     translate or clean up subtitle files
#   Experimental  specialised or unfinished utilities
#   Other         anything else (the default when there is no group)
# The case does not matter ("files" also works). A new name creates a new section after these.
group = "Files"
icon = "puzzle"

[ui]
kind = "form"
run_mode = "run"

[permissions]
# Advisory: shown to the user before they enable the mod. This one only reads.
network = false
writes_files = false
runs_programs = false

[[params]]
name = "folder"
type = "folder"
label = "Folder"
help = "The folder to look through."

[[params]]
name = "recursive"
type = "bool"
label = "Include subfolders"
default = true

[[params]]
name = "top"
type = "integer"
label = "Show the top N extensions"
help = "How many extensions to list, most common first."
default = 10
min = 1
max = 100

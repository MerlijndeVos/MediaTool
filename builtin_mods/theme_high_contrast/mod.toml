# A theme for people who need stronger contrast: black on white, white on black, a solid
# outline around everything, and a yellow accent in dark mode. Text pairs are at least 7:1
# (WCAG AAA); the icons on the coloured section chips are at least 6.5:1.
id = "theme-high-contrast"
name = "High contrast"
description = "Maximum contrast between text and background, strong outlines. Light and dark."
version = "1.0.0"
author = "Toolbox"
type = "theme"
api_version = 2

[theme]
radius = "0.375rem"
font = "system"

[theme.light]
background = "#ffffff"
foreground = "#000000"
card = "#ffffff"
card-foreground = "#000000"
primary = "#0033cc"
primary-foreground = "#ffffff"
secondary = "#e6e6e6"
secondary-foreground = "#000000"
muted = "#ececec"
muted-foreground = "#262626"
accent = "#d9d9d9"
accent-foreground = "#000000"
border = "#404040"
input = "#000000"
ring = "#0033cc"
destructive = "#a80000"
destructive-foreground = "#ffffff"
danger = "#b00000"
danger-text = "#a00000"
warning = "#b45f00"
warning-text = "#6b3a00"
success = "#006b3c"
success-text = "#005a32"
log-info = "#1a1a1a"
log-warn = "#7a3d00"
log-error = "#a00000"
syntax-keyword = "#6a00b0"
syntax-string = "#005a1e"
syntax-number = "#8a3000"
syntax-comment = "#3d3d3d"
syntax-function = "#0033cc"
syntax-type = "#004c57"
syntax-property = "#9b0040"
syntax-meta = "#6b3a00"
category-files = "#b4002c"
category-media = "#0033cc"
category-subtitles = "#6a1bb0"
category-experimental = "#8a4b00"
category-other = "#00694a"
category-settings = "#3d4a5a"
category-foreground = "#ffffff"

[theme.dark]
background = "#000000"
foreground = "#ffffff"
card = "#0a0a0a"

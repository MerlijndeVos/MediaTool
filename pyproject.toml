[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "media-tool"
version = "1.0.9"
description = "Cross-platform desktop app for local video conversion, library organization, and downloads"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2024.0.0",
    "yt-dlp-ejs>=0.8.0",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/MerlijndeVos/MediaTool"
Repository = "https://github.com/MerlijndeVos/MediaTool"
Issues = "https://github.com/MerlijndeVos/MediaTool/issues"
Changelog = "https://github.com/MerlijndeVos/MediaTool/releases"

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]
desktop = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pywebview>=5.0",
]
dev = []
pack = [
    "pyinstaller>=6.0",
    "pillow>=10.0",
]

[project.scripts]
media-tool = "cli.__main__:main"
media-tool-web = "web.__main__:main"
media-tool-app = "web.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*", "web*"]

[tool.setuptools]
py-modules = ["app"]

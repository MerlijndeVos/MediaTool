name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -e ".[desktop,pack]"

      - name: Verify tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY="$(python -c "from core.version import read_pyproject_version; print(read_pyproject_version())")"
          if [ "$TAG" != "$PY" ]; then
            echo "Tag v$TAG does not match pyproject.toml version $PY"
            exit 1
          fi

      - name: Sync frontend package version
        shell: bash
        run: |
          VERSION="$(python -c "from core.version import read_pyproject_version; print(read_pyproject_version())")"
          npm pkg set "version=${VERSION}" --prefix web/frontend

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Render app icons
        run: python packaging/icons/render_icons.py

      - name: Embed GitHub token for in-app updates (private repo)
        shell: bash
        env:
          MEDIA_TOOL_GITHUB_TOKEN: ${{ secrets.MEDIA_TOOL_UPDATE_TOKEN }}
        run: |
          if [ -n "${MEDIA_TOOL_GITHUB_TOKEN}" ]; then
            mkdir -p packaging/secrets
            printf '%s' "${MEDIA_TOOL_GITHUB_TOKEN}" > packaging/secrets/github_token
          else
            echo "MEDIA_TOOL_UPDATE_TOKEN not set — installers will not check private releases until a token is configured locally."
          fi

      - name: PyInstaller bundle
        run: pyinstaller packaging/media-tool.spec --noconfirm --clean

      - name: Platform installer
        shell: bash
        run: |
          VERSION="$(python -c "from core.version import read_pyproject_version; print(read_pyproject_version())")"
          case "${{ runner.os }}" in
            Windows)
              choco install innosetup -y
              # Git Bash rewrites /D... switches as paths; pass them through unchanged.
              MSYS2_ARG_CONV_EXCL='*' iscc "/DMyAppVersion=${VERSION}" packaging/windows/setup.iss
              ;;
            macOS) bash packaging/macos/build-dmg.sh "$VERSION" ;;
            Linux)
              sudo apt-get update
              sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 fuse libfuse2 librsvg2-bin
              wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
              chmod +x appimagetool
              sudo mv appimagetool /usr/local/bin/appimagetool
              bash packaging/linux/build-appimage.sh "$VERSION"
              ;;
          esac

      - name: List installers
        shell: bash
        run: ls -la packaging/dist/ || dir packaging\\dist

      - name: Upload release installer
        uses: actions/upload-artifact@v6
        with:
          name: media-tool-${{ matrix.os }}
          path: packaging/dist/MediaTool-*
          if-no-files-found: error
          compression-level: 6

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: media-tool-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded installers
        run: ls -laR artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
